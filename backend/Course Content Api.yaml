components:
  schemas:
    AssessmentStudent:
      type: object
      properties:
        student_course:
          type: integer
          readOnly: true
        student_id:
          type: string
          readOnly: true
        student_name:
          type: string
          readOnly: true
        marks:
          type: string
          readOnly: true
        attendance_percentage:
          type: string
          readOnly: true
      required:
      - attendance_percentage
      - marks
      - student_course
      - student_id
      - student_name
    Assignment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        session_course:
          type: integer
        title:
          type: string
          maxLength: 255
        description:
          type: string
        due_at:
          type: string
          format: date-time
        created_by:
          type: integer
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        files:
          type: array
          items:
            $ref: '#/components/schemas/AssignmentFile'
          readOnly: true
      required:
      - created_at
      - created_by
      - due_at
      - files
      - id
      - session_course
      - title
      - updated_at
    AssignmentCreateRequest:
      type: object
      properties:
        session_course:
          type: integer
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
        due_at:
          type: string
          format: date-time
        files:
          type: array
          items:
            type: string
            format: binary
          writeOnly: true
      required:
      - due_at
      - session_course
      - title
    AssignmentFile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        file:
          type: string
          format: uri
      required:
      - file
      - id
    AssignmentSubmission:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        assignment:
          type: integer
        student:
          type: integer
        note:
          type: string
        submitted_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        files:
          type: array
          items:
            $ref: '#/components/schemas/AssignmentSubmissionFile'
          readOnly: true
      required:
      - assignment
      - files
      - id
      - student
      - submitted_at
      - updated_at
    AssignmentSubmissionCreateRequest:
      type: object
      properties:
        assignment:
          type: integer
        note:
          type: string
        files:
          type: array
          items:
            type: string
            format: binary
          writeOnly: true
      required:
      - assignment
    AssignmentSubmissionFile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        file:
          type: string
          format: uri
      required:
      - file
      - id
    AttendanceBulkRequest:
      type: object
      properties:
        attendance:
          type: array
          items:
            $ref: '#/components/schemas/StudentAttendanceRequest'
      required:
      - attendance
    AttendanceSession:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        date:
          type: string
          format: date
      required:
      - date
      - id
    AttendanceSessionRequest:
      type: object
      properties:
        date:
          type: string
          format: date
      required:
      - date
    AttendanceStudent:
      type: object
      properties:
        student_course:
          type: integer
          readOnly: true
        student_id:
          type: string
          readOnly: true
        student_name:
          type: string
          readOnly: true
        status:
          type: string
          readOnly: true
      required:
      - status
      - student_course
      - student_id
      - student_name
    CourseAnnouncement:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        session_course:
          type: integer
        title:
          type: string
          maxLength: 255
        message:
          type: string
        is_pinned:
          type: boolean
        created_by:
          type: integer
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        files:
          type: array
          items:
            $ref: '#/components/schemas/CourseAnnouncementFile'
          readOnly: true
      required:
      - created_at
      - created_by
      - files
      - id
      - message
      - session_course
      - title
      - updated_at
    CourseAnnouncementCreateRequest:
      type: object
      properties:
        session_course:
          type: integer
        title:
          type: string
          minLength: 1
          maxLength: 255
        message:
          type: string

          type: array
          items:
            type: string
            format: binary
          writeOnly: true
    PatchedCourseMaterialCreateRequest:
      type: object
      properties:
        session_course:
          type: integer
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
        files:
          type: array
          items:
            type: string
            format: binary
          writeOnly: true
    StatusEnum:
      enum:
      - PRESENT
      - ABSENT
      type: string
      description: |-
        * `PRESENT` - Present
        * `ABSENT` - Absent
    StudentAssessmentBulkRequest:
      type: object
      properties:
        marks:
          type: array
          items:
            $ref: '#/components/schemas/StudentMarkRequest'
      required:
      - marks
    StudentAttendanceRequest:
      type: object
      properties:
        student_course:
          type: integer
        status:
          $ref: '#/components/schemas/StatusEnum'
      required:
      - status
      - student_course
    StudentMarkRequest:
      type: object
      properties:
        student_course:
          type: integer
        marks:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
      required:
      - marks
      - student_course
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

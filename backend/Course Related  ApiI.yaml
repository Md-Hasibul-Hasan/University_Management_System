components:
  schemas:
    AssessmentTypeEnum:
      enum:
      - attendance
      - quiz
      - assignment
      - incourse
      - evaluation
      - presentation
      - viva
      - final
      type: string
      description: |-
        * `attendance` - Attendance
        * `quiz` - Quiz
        * `assignment` - Assignment
        * `incourse` - Incourse
        * `evaluation` - Evaluation
        * `presentation` - Presentation
        * `viva` - Viva
        * `final` - Final
    CalculationTypeEnum:
      enum:
      - individual
      - average
      type: string
      description: |-
        * `individual` - Individual
        * `average` - Average
    Course:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          maxLength: 20
        title:
          type: string
          maxLength: 255
        credit:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,1})?$
        department:
          type: integer
        year_semester:
          type: integer
        course_type:
          $ref: '#/components/schemas/CourseTypeEnum'
        is_active:
          type: boolean
      required:
      - code
      - credit
      - department
      - id
      - title
      - year_semester
    CourseAssessment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        session_course:
          type: integer
        title:
          type: string
          maxLength: 100
        assessment_type:
          $ref: '#/components/schemas/AssessmentTypeEnum'
        max_marks:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        calculation_type:
          $ref: '#/components/schemas/CalculationTypeEnum'
        display_order:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
      required:
      - assessment_type
      - calculation_type
      - id
      - max_marks
      - session_course
      - title
    CourseAssessmentRequest:
      type: object
      properties:
        session_course:
          type: integer
        title:
          type: string
          minLength: 1
          maxLength: 100
        assessment_type:
          $ref: '#/components/schemas/AssessmentTypeEnum'
        max_marks:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        calculation_type:
          $ref: '#/components/schemas/CalculationTypeEnum'
        display_order:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
      required:
      - assessment_type
      - calculation_type
      - max_marks
      - session_course
      - title
    CourseRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 20
        title:
          type: string
          minLength: 1
          maxLength: 255
        credit:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,1})?$
        department:
          type: integer
        year_semester:
          type: integer
        course_type:
          $ref: '#/components/schemas/CourseTypeEnum'
        is_active:
          type: boolean
      required:
      - code
      - credit
      - department
      - title
      - year_semester
    CourseTypeEnum:
      enum:
      - theory
      - lab
      - viva
      - project
      type: string
      description: |-
        * `theory` - Theory
        * `lab` - Lab
        * `viva` - Viva
        * `project` - Project
    PaginatedCourseAssessmentList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/CourseAssessment'
    PaginatedCourseList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
